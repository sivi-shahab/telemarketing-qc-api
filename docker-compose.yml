# Compose repo API: infra (postgres, redis, minio) + service api.
# Infra ikut di sini karena API pemilik skema/migrasi. Worker + flower punya
# compose sendiri di repo telemarketing-qc-worker, dashboard di repo dashboard.
#
# Ketiganya berbagi network eksternal `qc-net`. Buat sekali di host:
#     docker network create qc-net
networks:
  default:
    external: true
    name: qc-net

services:
  # DINONAKTIFKAN dari `up` biasa (2026-09-02, cutover repo split).
  # POSTGRES_HOST di .env menunjuk DWH 10.155.32.28 schema `dashboard`, jadi
  # container ini tidak dipakai aplikasi. Dibiarkan di file (bukan dihapus)
  # supaya mode infra-lokal masih bisa dipakai untuk uji coba:
  #     docker compose --profile local-infra up -d
  postgres:
    profiles: ["local-infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --port 6378
    ports:
      - "6378:6378"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6378", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # DINONAKTIFKAN dari `up` biasa (2026-09-02, cutover repo split).
  # MINIO_ENDPOINT di .env = cdn.bankmega.local dengan kredensial per-bucket
  # (MINIO_ACCESS_KEY_*/MINIO_SECRET_KEY_*), jadi MinIO lokal tidak dipakai.
  minio:
    profiles: ["local-infra"]
    image: minio/minio:latest
    command: server /data --console-address ":4004" --address ":4003"
    ports:
      - "4003:4003"
      - "4004:4004"
    environment:
      # Default diberikan karena .env mode CDN tidak punya key global ini;
      # hanya relevan saat profile local-infra dipakai.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme123}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${REGISTRY:-local}/qc-api:${TAG:-latest}
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      PYTHONPATH: /app
      DWH_API_BASE_URL: ${DWH_API_BASE_URL:-http://host.docker.internal:8002}
    # Folder antrian STT (WATCH_DIR di /data/script_antrian/producer_watch.py).
    # Audio hasil Upload Audio ditulis ke sini supaya producer + consumer
    # memprosesnya; tanpa mount ini container hanya menulis ke lapisan sementara
    # miliknya sendiri dan tidak ada yang pernah membacanya.
    volumes:
      - ${AUDIO_RECORDING_DIR:-/data/recording}:${AUDIO_RECORDING_DIR:-/data/recording}
    # Supaya container bisa menjangkau service yang listen di host (App A / DWH).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hanya redis: postgres & minio ada di luar (DWH / CDN). Menyebut service
    # ber-profile di depends_on akan membuat Compose ikut menyalakannya.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
