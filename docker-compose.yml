# Compose repo API: infra (postgres, redis, minio) + service api.
# Infra ikut di sini karena API pemilik skema/migrasi. Worker + flower punya
# compose sendiri di repo telemarketing-qc-worker, dashboard di repo dashboard.
#
# Ketiganya berbagi network eksternal `qc-net`. Buat sekali di host:
#     docker network create qc-net
networks:
  default:
    external: true
    name: qc-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --port 6378
    ports:
      - "6378:6378"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6378", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":4004" --address ":4003"
    ports:
      - "4003:4003"
      - "4004:4004"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${REGISTRY:-local}/qc-api:${TAG:-latest}
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      PYTHONPATH: /app
      DWH_API_BASE_URL: ${DWH_API_BASE_URL:-http://host.docker.internal:8002}
    # Supaya container bisa menjangkau service yang listen di host (App A / DWH).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
